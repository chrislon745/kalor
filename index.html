<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a0c05">
<title>Kalor</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app"></main>

<nav id="nav" hidden>
  <button data-view="today" class="active"><span class="ico">◎</span>Heute</button>
  <button data-view="body"><span class="ico">⚖</span>Körper</button>
  <button data-view="settings"><span class="ico">⚙</span>Profil</button>
</nav>

<div id="sheet" hidden>
  <div class="sheet-bg" data-close></div>
  <div class="sheet-panel"><div id="sheet-body"></div></div>
</div>

<div id="toast" hidden></div>

<input type="file" id="file-food" accept="image/*" capture="environment" hidden>
<input type="file" id="file-progress" accept="image/*" capture="environment" hidden>
<input type="file" id="file-import" accept="application/json" hidden>

<script src="app.js"></script>
</body>
</html>
